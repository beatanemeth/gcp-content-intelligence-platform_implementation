# Offline checks only: lints the shell scripts; runs none of them.
name: Shell checks

on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

# The token can only read the repository.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ShellCheck is preinstalled on the runner.
      - name: ShellCheck
        run: shellcheck helpers/*.sh
