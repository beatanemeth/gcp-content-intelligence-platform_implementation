# Tool settings only: the function is deployed as a zip, not installed as a package.

[tool.pytest]
testpaths = ["tests"]
# Tests import main from its own folder, as the function's runtime does.
pythonpath = ["function"]

[tool.ruff]
# The function's runtime version.
target-version = "py314"
# Import sorting treats main as own code, not as a third-party library.
src = [".", "function"]
# Docs hold no Python code blocks, and CI skips docs-only changes.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Defaults (E, F), plus import order (I), likely bugs (B) and modern syntax (UP).
select = ["E", "F", "I", "B", "UP"]
